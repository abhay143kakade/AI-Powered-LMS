<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Course - AI-LMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 20px 5%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #172554;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {

            outline: none;

            border-color: #23429a;

            box-shadow:
                0 0 0 2px
                rgba(35, 66, 154, 0.1);
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .btn {

            padding: 12px 22px;

            border-radius: 8px;

            border: none;

            text-decoration: none;

            cursor: pointer;

            font-size: 15px;
        }

        .btn-primary {

            background: #23429a;

            color: white;
        }

        .btn-primary:hover {

            background: #172f78;
        }

        .btn-secondary {

            background: #e5e7eb;

            color: #333;
        }

        .btn-secondary:hover {

            background: #d1d5db;
        }

        @media (max-width: 600px) {

            .navbar {

                flex-direction: column;

                gap: 15px;
            }

            .buttons {

                flex-direction: column;
            }

            .btn {

                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<div class="navbar">

    <div class="logo">
        AI-LMS ADMIN
    </div>

    <div class="nav-links">

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('courses') }}">
            Student View
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="container">

    <div class="card">

        <h1>
            Create New Course
        </h1>

        <p class="subtitle">
            Add a new course to the AI-LMS platform.
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            action="{{ url_for('create_course') }}"
            method="POST"
        >


            <!-- COURSE TITLE -->

            <div class="form-group">

                <label for="title">
                    Course Title *
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Python Programming"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Course Description *
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter a description for this course..."
                    required
                ></textarea>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject *
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Example: Programming"
                    required
                >

            </div>


            <!-- DIFFICULTY -->

            <div class="form-group">

                <label for="difficulty">
                    Difficulty
                </label>

                <select
                    id="difficulty"
                    name="difficulty"
                >

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Course
                </button>


                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>

</div>


</body>

</html>
