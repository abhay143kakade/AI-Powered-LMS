<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - AI-LMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1e3a8a;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <strong>AI-LMS</strong>

        <span>Student Dashboard</span>
    </div>

    <div class="container">

        <h1>Welcome to AI-LMS</h1>

        <div class="card">
            <h2>Personalized Learning</h2>
            <p>Your AI-powered learning journey will appear here.</p>
        </div>

        <div class="card">
            <h2>Performance</h2>
            <p>Your performance analytics will appear here.</p>
        </div>

        <div class="card">
            <h2>AI Recommendations</h2>
            <p>AI-recommended study materials will appear here.</p>
        </div>

    </div>

</body>

</html>
