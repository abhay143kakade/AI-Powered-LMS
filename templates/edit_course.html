<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Course - AI-LMS</title>

    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7fb;
        }

        .navbar {
            background: #172554;

            color: white;

            padding: 20px 5%;

            display: flex;

            justify-content: space-between;
        }

        .navbar a {
            color: white;

            text-decoration: none;
        }

        .container {
            width: 90%;

            max-width: 750px;

            margin: 50px auto;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.08);
        }

        h1 {
            color: #172554;
        }

        label {
            display: block;

            margin-top: 20px;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccd3df;

            border-radius: 8px;

            font-size: 16px;
        }

        textarea {
            min-height: 150px;

            resize: vertical;
        }

        button {
            margin-top: 25px;

            padding: 13px 25px;

            background: #23429a;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 15px;

            border-radius: 8px;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            color: #23429a;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="navbar">

    <strong>
        AI-LMS ADMIN
    </strong>

    <a href="{{ url_for('admin_dashboard') }}">
        Dashboard
    </a>

</div>


<div class="container">

    <div class="card">

        <h1>
            Edit Course
        </h1>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for(
                'edit_course',
                course_id=course.id
            ) }}"
        >


            <label>
                Course Title
            </label>

            <input
                type="text"
                name="title"
                value="{{ course.title }}"
                required
            >


            <label>
                Description
            </label>

            <textarea
                name="description"
                required
            >{{ course.description }}</textarea>


            <label>
                Subject
            </label>

            <input
                type="text"
                name="subject"
                value="{{ course.subject }}"
                required
            >


            <label>
                Difficulty
            </label>

            <select name="difficulty">

                <option
                    value="Beginner"
                    {% if course.difficulty == "Beginner" %}
                        selected
                    {% endif %}
                >
                    Beginner
                </option>

                <option
                    value="Intermediate"
                    {% if course.difficulty == "Intermediate" %}
                        selected
                    {% endif %}
                >
                    Intermediate
                </option>

                <option
                    value="Advanced"
                    {% if course.difficulty == "Advanced" %}
                        selected
                    {% endif %}
                >
                    Advanced
                </option>

            </select>


            <button type="submit">
                Save Changes
            </button>

        </form>


        <a
            href="{{ url_for('admin_dashboard') }}"
            class="back"
        >
            ← Back to Admin Dashboard
        </a>

    </div>

</div>


</body>

</html>
